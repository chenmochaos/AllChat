name: Desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '*.py', '*.js', '*.html', '*.css', 'assets/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, label: windows-x64}
          - {runner: macos-15, label: macos-arm64}
          - {runner: macos-15-intel, label: macos-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_workflow
      - run: python -m pip install "pyinstaller>=6.12,<7" "pywebview>=5.4,<7" "pillow>=11,<13"
      - run: python desktop/build_portable.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python desktop/smoke_packaged.py dist/AllChat/AllChat.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/AllChat -DestinationPath AllChat-${{ matrix.label }}.zip
      - if: runner.os == 'macOS'
        run: |
          python desktop/smoke_packaged.py dist/AllChat.app/Contents/MacOS/AllChat
          ditto -c -k --keepParent dist/AllChat.app AllChat-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AllChat-${{ matrix.label }}
          path: AllChat-${{ matrix.label }}.zip
          if-no-files-found: error
