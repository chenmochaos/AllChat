<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AllChat · 群聊工作区</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="top">
      <a href="./index.html" class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>AllChat</a>
      <nav aria-label="工作区">
        <button id="history" class="quiet">历史记录</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="chat" aria-labelledby="runTitle">
      <div class="chat-head">
        <div class="chat-title">
          <div class="context"><span id="source">示例讨论</span><span class="context-dot">·</span><span id="verdict" aria-live="polite"></span></div>
          <h1 id="runTitle"></h1>
        </div>
      </div>
      <div class="room-head"><strong>成员</strong><span id="memberCount"></span></div>
      <div id="members" aria-label="讨论成员"></div>
      <div class="view-tabs" aria-label="查看内容"><button type="button" id="showChat" aria-pressed="true">群聊</button><button type="button" id="showPlan" aria-pressed="false">方案 <span id="versions"></span></button></div>
      <div id="conversation" class="viewport" role="log" aria-label="讨论消息" tabindex="0"></div>
      <div id="plan" class="viewport plan" aria-label="方案正文" hidden>
        <div id="planBody"></div>
      </div>
      <div id="handoff" hidden></div>
      <form id="compose">
        <button type="button" class="icon-button model-picker" id="config" aria-label="选择参会模型" title="选择参会模型">
          <span id="composeModels" aria-hidden="true"></span><span class="caret" aria-hidden="true">⌄</span>
        </button>
        <textarea id="task" rows="1" maxlength="2000" required placeholder="写下一个问题，邀请 AI 一起讨论…" aria-label="新讨论的主题"></textarea>
        <button class="send" type="submit" aria-label="开始讨论" title="开始讨论">↑</button>
      </form>
      <p class="demo-note">本地交互演示 · 回复为示例内容</p>
    </section>
  </main>
<dialog id="panel" aria-labelledby="panelTitle">
    <div class="dialog-head"><h2 id="panelTitle"></h2><button class="icon-button close" type="button" aria-label="关闭" id="close">×</button></div>
    <div id="panelBody"></div>
  </dialog>
</body>
</html>
