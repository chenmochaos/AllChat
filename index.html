<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AllChat · 讨论工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header><div class="top"><a class="brand" href="./index.html"><i class="brandmark" aria-hidden="true"></i>AllChat</a><span class="project">/　工作区</span><button class="quiet history" id="history">历史记录</button></div></header>
  <main>
    <section aria-labelledby="composeTitle">
      <div class="meta"><i class="dot"></i> 本地工作区 <span class="slash">/</span> AllChat</div>
      <h1 id="composeTitle">发起讨论</h1>
      <form id="compose">
        <textarea id="task" aria-label="讨论需求" placeholder="这次想和模型们一起解决什么问题？" maxlength="2000" required></textarea>
        <div class="tools"><button type="button" class="quiet config" id="config"><span class="duo" aria-hidden="true"><b>›</b><b>✳</b></span><span id="modelLabel">Codex + Claude</span> ﹀</button><button class="primary" type="submit">开始讨论 <b>↑</b></button></div>
      </form>
      <div class="caption"><span class="tiny-dot"></span> 交互演示 · 新讨论使用示例回复</div>
    </section>
    <section class="result" aria-labelledby="runTitle">
      <div class="section-label"><span id="source"></span><span class="rule"></span><span id="when"></span></div>
      <h2 id="runTitle"></h2><p class="summary" id="summary" aria-live="polite"></p>
      <div id="rows"></div><div id="next"></div>
    </section>
  </main>
  <dialog id="panel"><div class="dialog-head"><h2 id="panelTitle"></h2><button class="close" aria-label="关闭" id="close">×</button></div><div id="panelBody"></div></dialog>
</body>
</html>
